[package]
name = "kiwrap-live"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Live KiCad helper: per-window Windows.Graphics.Capture surfaces streamed over a loopback WebSocket, with mirror (SendInput) and events (PostMessage) input injectors"
publish = false

[[bin]]
name = "kiwrap-live"
path = "src/main.rs"

[dependencies]
windows-capture = "2.0"          # MIT: Windows.Graphics.Capture per window / monitor
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "require-simd"] }  # Unlicense/MIT over libjpeg-turbo (BSD-3/IJG)
png = "0.17"                      # MIT/Apache-2.0
base64 = "0.22"                   # MIT/Apache-2.0
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
tokio-tungstenite = "0.26"        # MIT; permessage-deflate is not negotiated (feature off)
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
