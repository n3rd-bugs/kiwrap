<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>kiwrap demo page (iframe target)</title>
<style>
  html,body{margin:0;height:100%;background:#102030;color:#ddd;font:13px Consolas,monospace;overflow:hidden}
