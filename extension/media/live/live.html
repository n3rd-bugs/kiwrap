<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="__CSS__">
</head>
<body>
<div id="viewport" data-vscode-context='{"preventDefaultContextMenuItems": true, "webviewSection": "kiwrap.live"}'>
  <div id="stage" tabindex="0" aria-label="Live KiCad view">
    <canvas id="canvas" width="1" height="1"></canvas>
    <div id="cursor" class="hidden"></div>
  </div>
  <div id="card">
    <div id="card-title">No live KiCad surface</div>
    <div id="card-text"></div>
    <button id="btn-start" class="hidden">Start Live KiCad</button>
  </div>
  <div id="hud" data-mode="view" data-conn="idle">
    <span id="hud-title">no surface</span>
    <span id="hud-mode" class="pill">view-only</span>
    <span id="hud-conn" class="pill">idle</span>
    <span id="hud-size"></span>
    <span id="hud-fps">0 fps</span>
    <span id="hud-kbps">0 kbit/s</span>
    <span id="hud-lat">lat -</span>
    <button id="btn-raise" title="Bring the real KiCad window to the front">Raise KiCad</button>
    <button id="btn-lock" class="hidden" title="Toggle pointer lock">Lock pointer</button>
    <button id="btn-hud" title="Collapse the HUD">&#9662;</button>
  </div>
</div>
<script type="module" nonce="__NONCE__" src="__JS__"></script>
</body>
</html>
