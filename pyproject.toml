[project]
name = "kiwrap"
version = "0.0.1"
description = "AI-agent-facing wrapper over installed KiCad binaries (MCP server + VS Code extension)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Usama Masood" }]
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.7",
    # KiCad 11 IPC client (kiwrap.backends.ipc). Pinned to a git commit because no 0.9 wheel is on
    # PyPI (latest is 0.8.0, built against 10.0.6 protos, which cannot send OpenDocument). A PEP 508
    # direct reference, not a bare `==0.9.0.dev0` + [tool.uv.sources]: the source table does not
    # travel with the built kiwrap wheel, whose `Requires-Dist: kicad-python==0.9.0.dev0` existed on
    # no index and made `pip install kiwrap-*.whl` / `uv tool install` unsatisfiable (reviewer
    # finding 6, 2026-09-19). Building it from git needs a toolchain and clones KiCad as a submodule
    # (3.5 GB); scripts/ci/build_kicad_python_wheel.py builds the wheel once from a shallow, sparse
    # clone and CI installs that wheel (`uv sync --no-install-package kicad-python` + the
    # wheelhouse) instead of building here. Its own deps (protobuf<6, pynng, zstandard, jsonschema)
    # come with it. Never install kipy 0.8.0 into the same environment (proto packages collide).
    "kicad-python @ git+https://gitlab.com/kicad/code/kicad-python.git@f79cebd1c09f6ef1d16e74d538da521e68c2d9f1",
]

[project.optional-dependencies]
render = ["pypdfium2>=4.30"]

[project.scripts]
kiwrap = "kiwrap.core.cli_main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "import-linter>=2.1",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# the kicad-python git pin above is a PEP 508 direct reference (PyPI would refuse the upload;
# kiwrap is not on PyPI while it depends on an unreleased kicad-python)
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kiwrap"]

# Site hook for kicad-python's generated protobuf modules (kiwrap.backends.ipc explains why): the
# .pth line `import _kiwrap_kipy_proto` appends <site-packages>/kipy/proto to sys.path at start-up.
# hatchling copies force-include files into editable wheels too (verified: hatchling 1.32.3).
[tool.hatch.build.targets.wheel.force-include]
"src/kiwrap/backends/ipc/_pth/kiwrap_kipy_proto.pth" = "kiwrap_kipy_proto.pth"
"src/kiwrap/backends/ipc/_pth/_kiwrap_kipy_proto.py" = "_kiwrap_kipy_proto.py"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "conformance"]
# spikes/ holds the frozen evidence scripts behind docs/VERIFICATION.md (plus two stray virtualenv
# Scripts/ trees) and prototypes/ the display experiments (docs/research/display); neither is
# shipped code and neither is linted, so `ruff check .` (CI) stays green.
extend-exclude = ["spikes", "prototypes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance/tests", "scripts/ci/tests_ci"]
# T1-T9 certification files are named t<N>_<topic>.py so `kiwrap certify` can pick them by number.
python_files = ["test_*.py", "t[0-9]*_*.py"]
timeout = 600
markers = [
    "kicad: needs at least one installed KiCad (skipped when none is discovered)",
    "kicad_version(spec): needs a specific installed KiCad major.minor, e.g. '10.0'",
    "kicad_patch(id): needs an installed KiCad whose capability record lists the kiwrap patch id (docs/UPSTREAM.md 3.3; auto-skip on stock installs)",
    "gui: launches a KiCad GUI process (sandboxed); never run in parallel with another gui test",
    "network: needs internet access",
    "slow: takes more than ~30 s",
    "claude_code: reads the installed Claude Code bundle (CLAUDE_CODE_EXECPATH or ~/.vscode/extensions); auto-skips without one; only literal anchors fail (docs/DECISIONS.md D24)",
]
filterwarnings = ["error::DeprecationWarning:kiwrap.*"]

[tool.mypy]
python_version = "3.11"
packages = ["kiwrap"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

# Architectural contracts (run with `uv run lint-imports`).
[tool.importlinter]
root_package = "kiwrap"

[[tool.importlinter.contracts]]
name = "formats has zero dependencies on the rest of kiwrap"
type = "forbidden"
source_modules = ["kiwrap.formats"]
forbidden_modules = ["kiwrap.core", "kiwrap.backends", "kiwrap.installation", "kiwrap.capability", "kiwrap.sandbox", "kiwrap.platform"]

[[tool.importlinter.contracts]]
name = "backends never import core"
type = "forbidden"
source_modules = ["kiwrap.backends"]
forbidden_modules = ["kiwrap.core"]

[[tool.importlinter.contracts]]
name = "layers: core -> backends -> (installation, capability, sandbox, platform) -> formats"
type = "layers"
layers = ["kiwrap.core", "kiwrap.backends", "kiwrap.sandbox", "kiwrap.capability", "kiwrap.installation", "kiwrap.platform", "kiwrap.formats"]
